```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBook | Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="movies-page">

    <header class="navbar">
        <a href="index.html" class="logo">
            Cine<span>Book</span><b>.</b>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="booking.html">Book Tickets</a>
        </nav>
    </header>

    <main>
        <section class="auth-section">
            <div class="auth-card">
                <p class="eyebrow">WELCOME BACK</p>
                <h1>Login to <span>CineBook.</span></h1>
                <p>Sign in to continue your movie experience.</p>

                <form id="loginForm">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                    <button type="submit" class="primary-button">
                        Login →
                    </button>

                    <p id="authMessage" role="status" aria-live="polite"></p>
                </form>

                <p>
                    Don't have an account?
                    <a href="register.html">Create one</a>
                </p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <a href="index.html" class="logo">
            Cine<span>Book</span><b>.</b>
        </a>
        <p>Your movie night, made memorable.</p>
    </footer>
<script src="auth.js"></script>
</body>
</html>
