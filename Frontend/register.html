```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBook | Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="movies-page">

    <header class="navbar">
        <a href="index.html" class="logo">
            Cine<span>Book</span><b>.</b>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="booking.html">Book Tickets</a>
        </nav>
    </header>

    <main>
        <section class="auth-section">
            <div class="auth-card">
                <p class="eyebrow">JOIN CINEBOOK</p>
                <h1>Create your <span>account.</span></h1>
                <p>Get ready for your next cinematic experience.</p>

                <form id="registerForm">
                    <label for="fullName">Full name</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        maxlength="100"
                        required>

                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        maxlength="150"
                        required>

                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 8 characters"
                        minlength="8"
                        required>

                    <button type="submit" class="primary-button">
                        Create Account →
                    </button>

                    <p id="authMessage" role="status" aria-live="polite"></p>
                </form>

                <p>
                    Already registered?
                    <a href="login.html">Login</a>
                </p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <a href="index.html" class="logo">
            Cine<span>Book</span><b>.</b>
        </a>
        <p>Your movie night, made memorable.</p>
    </footer>
<script src="auth.js"></script>
</body>
</html>
```
